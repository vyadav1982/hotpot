<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #e1e1e1; border-radius: 8px; }
        .header { background-color: #2563eb; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { padding: 30px 20px; }
        .button { background-color: #2563eb; color: white; padding: 12px 24px; text-decoration: none; border-radius: 4px; display: inline-block; }
        .footer { margin-top: 30px; padding-top: 20px; border-top: 1px solid #e1e1e1; font-size: 12px; color: #666; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>{% block header_title %}Email Notification{% endblock %}</h1>
            <p>Hotpot • Cafeteria Management App</p>
        </div>

        <!-- Main Content Block -->
        <div class="content">
            {% block content %}{% endblock %}
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>© {{ frappe.utils.now_datetime().year }} BytePanda Technologies. All rights reserved.</p>
            <p>
                <a href="https://bytepanda.in" style="color: #2563eb;">Website</a> | 
                <a href="mailto:info@bytepanda.in" style="color: #2563eb;">Support</a> | 
                <a href="https://hotpot.bytepanda.in/privacy" style="color: #2563eb;">Privacy Policy</a>
            </p>
        </div>
    </div>
</body>
</html>
