<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Email Notification</title>
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; margin:0; padding:0; background-color:#f9f9f9;">
    <div style="max-width: 600px; margin: 20px auto; padding: 20px; border: 1px solid #e1e1e1; border-radius: 8px; background:#ffffff;">
        
        <!-- Header -->
        <div style="background-color: #2563eb; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0;">
            <h1 style="margin:0; font-size: 24px;">{% block header_title %}Email Notification{% endblock %}</h1>
            <p style="margin:5px 0 0;">Hotpot • Cafeteria Management App</p>
        </div>

        <!-- Content -->
        <div style="padding: 30px 20px;">
            {% block content %}{% endblock %}
        </div>

        <!-- Footer -->
        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #e1e1e1; font-size: 12px; color: #666; text-align: center;">
            <p style="margin:0;">© {{ frappe.utils.now_datetime().year }} BytePanda Technologies. All rights reserved.</p>
            <p style="margin:5px 0 0;">
                <a href="https://bytepanda.in" style="color: #2563eb; text-decoration: none;">Website</a> | 
                <a href="mailto:info@bytepanda.in" style="color: #2563eb; text-decoration: none;">Support</a> | 
                <a href="https://hotpot.bytepanda.in/privacy" style="color: #2563eb; text-decoration: none;">Privacy Policy</a>
            </p>
        </div>
    </div>
</body>
</html>
